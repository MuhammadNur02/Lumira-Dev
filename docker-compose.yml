# Local Postgres 17 for development (Task.md P2.04): `docker compose up -d postgres`
# DATABASE_URL=postgresql://postgres:postgres@localhost:5432/lumira
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumira
    ports: ['5432:5432']
    volumes: ['lumira-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lumira']
      interval: 5s
      retries: 10
volumes:
  lumira-pg:
