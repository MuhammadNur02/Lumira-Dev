name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lint, typecheck and unit/integration tests need no secrets (src/lib/env.ts escape hatch).
      SKIP_ENV_VALIDATION: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm check:contrast
      # PGlite gives every integration suite a disposable, fully migrated Postgres without Docker.
      - run: pnpm test:coverage
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain src/db/migrations
            exit 1
          fi

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder values that satisfy env validation; the build talks to no service
      # (CONTENT_SOURCE=fixtures). Real secrets live only in Vercel.
      - run: node scripts/env-local.mjs --force
      - run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsubHVtaXJhLmRldiQ=
          CLERK_SECRET_KEY: sk_live_build_verification_only
          CLERK_WEBHOOK_SIGNING_SECRET: whsec_YnVpbGQtdmVyaWZpY2F0aW9u
